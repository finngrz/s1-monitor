name: Echtzeit sammeln

# Dauerbetrieb ohne Lücken:
# - Ein Lauf sammelt bis zu 5,5 Stunden am Stück, in Abschnitten von 28 Minuten.
#   Nach jedem Abschnitt werden die Daten gespeichert (höchstens 30 Minuten Datenverlust bei einem Absturz).
# - Am Ende startet der Lauf selbst seinen Nachfolger. Der wartet, bis der Vorgänger fertig ist (Lücke ca. 1 Minute).
# - Der stündliche Zeitplan ist nur ein Sicherheitsnetz, falls die Kette einmal reißt.
#
# AUSGESCHALTET, solange die Repository-Variable SAMMLER_AKTIV nicht auf "ja" steht.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sammler/**"
      - ".github/workflows/sammler.yml"

permissions:
  contents: write   # nur für den Zweig "live" (verschlüsselter Live-Stand)
  actions: write

concurrency:
  group: sammler
  cancel-in-progress: false

jobs:
  sammeln:
    if: vars.SAMMLER_AKTIV == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Benötigte Tage bestimmen
        id: tage
        run: |
          echo "vor3=$(TZ=Europe/Berlin date -d '3 days ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "vor2=$(TZ=Europe/Berlin date -d '2 days ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "gestern=$(TZ=Europe/Berlin date -d yesterday +%F)" >> "$GITHUB_OUTPUT"
          echo "heute=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_OUTPUT"
          echo "morgen=$(TZ=Europe/Berlin date -d tomorrow +%F)" >> "$GITHUB_OUTPUT"

      - name: Privates Daten-Repository holen (nur die letzten Tage)
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATEN_REPO }}
          token: ${{ secrets.DATEN_TOKEN }}
          path: daten
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /stationen_geprueft.json
            /README.md
            /*/${{ steps.tage.outputs.vor3 }}/
            /*/${{ steps.tage.outputs.vor2 }}/
            /*/${{ steps.tage.outputs.gestern }}/
            /*/${{ steps.tage.outputs.heute }}/
            /*/${{ steps.tage.outputs.morgen }}/

      - name: Git einrichten
        run: |
          git -C daten config user.name "s1-monitor-bot"
          git -C daten config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pflege (Tage zusammenfassen, Endstand, Monatsarchiv, Historie)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DATEN_TOKEN }}
        run: |
          if ! python sammler/pflege.py --daten daten --repo "${{ vars.DATEN_REPO }}"; then
            echo "::error title=Pflege::Pflege fehlgeschlagen, Sammlung läuft trotzdem weiter."
            exit 1
          fi

      - name: Fällige Auswertungen anstoßen
        # GitHub startet Zeitplan-Läufe teils mit Stunden Verspätung. Der Sammler läuft ohnehin
        # rund um die Uhr und stößt deshalb Gesundheits-Check, Prognose-Tabelle und Dashboard selbst an.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          heute=$(date -u +%F); stunde=$((10#$(date -u +%H)))
          letzter() { gh run list --repo "$REPO" --workflow "$1" --limit 20 --json createdAt,conclusion \
                        -q '[.[] | select(.conclusion != "skipped")][0].createdAt' 2>/dev/null; }
          if [ "$stunde" -ge 6 ] && [[ "$(letzter gesundheit.yml)" != ${heute}* ]]; then
            gh workflow run gesundheit.yml --repo "$REPO" --ref main && echo "Gesundheits-Check angestoßen"
          fi
          if [ "$stunde" -ge 3 ] && [[ "$(letzter prognose.yml)" != ${heute}* ]]; then
            gh workflow run prognose.yml --repo "$REPO" --ref main && echo "Prognose-Tabelle angestoßen"
          fi
          d=$(letzter dashboard.yml)
          if [ -z "$d" ] || [ $(( $(date -u +%s) - $(date -u -d "$d" +%s) )) -gt $((6 * 3600)) ]; then
            gh workflow run dashboard.yml --repo "$REPO" --ref main && echo "Dashboard angestoßen"
          fi

      - name: Sammeln (Abschnitte von 15 Minuten, bis zu 5,5 Stunden)
        env:
          GTI_USER: ${{ secrets.GTI_USER }}
          GTI_PASS: ${{ secrets.GTI_PASS }}
          LIVE_PASSWORT: ${{ secrets.LIVE_PASSWORT }}
          LIVE_TOKEN: ${{ github.token }}
        run: |
          speichern() {
            git -C daten add --sparse -A
            if git -C daten diff --cached --quiet; then return 0; fi
            git -C daten commit -q -m "Echtzeit-Daten $(date -u +%FT%TZ)"
            for versuch in 1 2 3 4 5; do
              if git -C daten pull -q --rebase && git -C daten push -q; then return 0; fi
              sleep $((versuch * 10))
            done
            echo "::warning title=Sammler::Speichern fehlgeschlagen, neuer Versuch nach dem nächsten Abschnitt."
          }

          ende=$((SECONDS + 330 * 60))
          status=0
          while [ $((ende - SECONDS)) -gt $((10 * 60)) ]; do
            rest_min=$(( (ende - SECONDS) / 60 ))
            # kurze Abschnitte: fällt der GitHub-Rechner aus, gehen höchstens 15 Minuten verloren
            dauer=$(( rest_min < 15 ? rest_min : 15 ))
            set +e
            python sammler/sammler.py --daten daten --dauer-min "$dauer"
            status=$?
            set -e
            speichern
            frei=$(free -m | awk '/^Mem:/{print $7}')
            echo "Rechner: ${frei} MB Arbeitsspeicher frei, $(df -h . | awk 'NR==2{print $4}') Platte frei"
            if [ "${frei:-9999}" -lt 1000 ]; then echo "::warning title=Sammler::Nur noch ${frei} MB Arbeitsspeicher frei"; fi
            if [ "$status" -ne 0 ]; then
              echo "::error title=Sammler::Abschnitt mit Status $status beendet, Lauf wird beendet."
              break
            fi
          done
          speichern
          exit "$status"

      - name: Nachfolger starten
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sammler.yml --repo "${{ github.repository }}" --ref main
