name: Echtzeit sammeln

# Dauerbetrieb ohne Lücken:
# - Ein Lauf sammelt bis zu 5,5 Stunden am Stück, in Abschnitten von 28 Minuten.
#   Nach jedem Abschnitt werden die Daten gespeichert (höchstens 30 Minuten Datenverlust bei einem Absturz).
# - Am Ende startet der Lauf selbst seinen Nachfolger. Der wartet, bis der Vorgänger fertig ist (Lücke ca. 1 Minute).
# - Der stündliche Zeitplan ist nur ein Sicherheitsnetz, falls die Kette einmal reißt.
#
# AUSGESCHALTET, solange die Repository-Variable SAMMLER_AKTIV nicht auf "ja" steht.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sammler/**"
      - ".github/workflows/sammler.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: sammler
  cancel-in-progress: false

jobs:
  sammeln:
    if: vars.SAMMLER_AKTIV == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Benötigte Tage bestimmen
        id: tage
        run: |
          echo "gestern=$(TZ=Europe/Berlin date -d yesterday +%F)" >> "$GITHUB_OUTPUT"
          echo "heute=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_OUTPUT"
          echo "morgen=$(TZ=Europe/Berlin date -d tomorrow +%F)" >> "$GITHUB_OUTPUT"

      - name: Privates Daten-Repository holen (gestern bis morgen)
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATEN_REPO }}
          token: ${{ secrets.DATEN_TOKEN }}
          path: daten
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /stationen_geprueft.json
            /README.md
            /*/${{ steps.tage.outputs.gestern }}/
            /*/${{ steps.tage.outputs.heute }}/
            /*/${{ steps.tage.outputs.morgen }}/

      - name: Sammeln (Abschnitte von 28 Minuten, bis zu 5,5 Stunden)
        env:
          GTI_USER: ${{ secrets.GTI_USER }}
          GTI_PASS: ${{ secrets.GTI_PASS }}
        run: |
          git -C daten config user.name "s1-monitor-bot"
          git -C daten config user.email "github-actions[bot]@users.noreply.github.com"

          speichern() {
            git -C daten add --sparse -A
            if git -C daten diff --cached --quiet; then return 0; fi
            git -C daten commit -q -m "Echtzeit-Daten $(date -u +%FT%TZ)"
            for versuch in 1 2 3 4 5; do
              if git -C daten pull -q --rebase && git -C daten push -q; then return 0; fi
              sleep $((versuch * 10))
            done
            echo "::warning title=Sammler::Speichern fehlgeschlagen, neuer Versuch nach dem nächsten Abschnitt."
          }

          ende=$((SECONDS + 330 * 60))
          status=0
          while [ $((ende - SECONDS)) -gt $((10 * 60)) ]; do
            rest_min=$(( (ende - SECONDS) / 60 ))
            dauer=$(( rest_min < 28 ? rest_min : 28 ))
            set +e
            python sammler/sammler.py --daten daten --dauer-min "$dauer"
            status=$?
            set -e
            speichern
            if [ "$status" -ne 0 ]; then
              echo "::error title=Sammler::Abschnitt mit Status $status beendet, Lauf wird beendet."
              break
            fi
          done
          speichern
          exit "$status"

      - name: Nachfolger starten
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sammler.yml --repo "${{ github.repository }}" --ref main
