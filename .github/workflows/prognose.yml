name: Prognose-Tabelle aktualisieren

# Bewertet täglich, wie gut die Live-Prognose an den Vortagen lag (auswertung/prognose_bewertung.py),
# und berechnet danach die Nachschlagetabelle für die Live-Prognose neu (auswertung/prognose_tabelle.py).
# Grundlage: private Endstand-Tabelle. Ergebnis (nur Zählungen): ergebnisse/prognose_tabelle.json.
# Der Sammler liest die Tabelle beim Start jedes Laufs, sie wird also mit jedem Tag genauer.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prognose
  cancel-in-progress: false

jobs:
  # Wie beim Gesundheits-Check: verspätete Zeitplan-Läufe überspringen, wenn heute schon gerechnet wurde.
  schon:
    runs-on: ubuntu-latest
    outputs:
      erledigt: ${{ steps.pruefen.outputs.erledigt }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: ergebnisse/prognose_tabelle.json
          sparse-checkout-cone-mode: false
      - id: pruefen
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"erzeugt_utc\": \"$(date -u +%F)" ergebnisse/prognose_tabelle.json 2>/dev/null; then
            echo "erledigt=ja" >> "$GITHUB_OUTPUT"
            echo "::notice title=Prognose::Tabelle ist von heute."
          fi

  berechnen:
    needs: schon
    if: vars.SAMMLER_AKTIV == 'ja' && needs.schon.outputs.erledigt != 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Git-Verlauf: welche Tabelle galt an welchem Tag

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Endstand-Tabelle holen (nur lesen, privat)
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATEN_REPO }}
          token: ${{ secrets.DATEN_TOKEN }}
          path: daten
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /endstand/

      - name: Gestrige Prognosen bewerten
        run: python auswertung/prognose_bewertung.py --endstand daten/endstand

      - name: Tabelle berechnen
        run: python auswertung/prognose_tabelle.py --endstand daten/endstand --ausgabe ergebnisse/prognose_tabelle.json

      - name: Speichern
        run: |
          git config user.name "s1-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ergebnisse/prognose_tabelle.json ergebnisse/prognose_bewertung.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Prognose-Tabelle aktualisiert"
          git pull -q --rebase && git push -q
